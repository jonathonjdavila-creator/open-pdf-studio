name: Custom Windows build (3D equipment)

# Unsigned Windows installer for the custom build (3D equipment embedding).
# Run it from the Actions tab ("Run workflow") or by pushing to custom-3d.
# The installer is attached to the run as an artifact.

on:
  workflow_dispatch:
  push:
    branches: [custom-3d]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: open-pdf-studio
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1' # 1.100 breaks tauri-build 2.6.2 (same pin as release.yml)

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Unit tests (3D embedding)
        run: node --test js/pdf/three-d/embed-3d.test.mjs js/pdf/three-d/u3d-reader.test.mjs js/pdf/three-d/pdf-3d.test.mjs

      - name: Build pdfium-worker sidecar and thumbnail handler
        shell: pwsh
        working-directory: .
        run: |
          cargo build --release -p pdfium-worker -p open-pdf-thumbnails
          New-Item -ItemType Directory -Force open-pdf-studio/src-tauri/binaries | Out-Null
          Copy-Item target/release/pdfium-worker.exe open-pdf-studio/src-tauri/binaries/pdfium-worker-x86_64-pc-windows-msvc.exe -Force
          Copy-Item target/release/open_pdf_thumbnails.dll open-pdf-studio/src-tauri/binaries/open-pdf-thumbnails.dll -Force

      # No updater signing key in a fork: turn off updater artifacts so the
      # bundler does not demand TAURI_SIGNING_PRIVATE_KEY.
      - name: Build installer (unsigned)
        shell: pwsh
        run: |
          '{"bundle":{"createUpdaterArtifacts":false}}' | Set-Content -Path src-tauri/tauri.custom.conf.json -Encoding utf8
          npx tauri build --config src-tauri/tauri.custom.conf.json

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: OpenPDFStudio-custom-3d-windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: error
